            </p>


            <form id="loginForm">

                <label for="correo">
                    Correo electrónico
                </label>

                <input type="email" id="correo" name="correo" maxlength="35" placeholder="correo@ejemplo.com" required>


                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password" id="contrasena" name="contrasena" maxlength="15"
                    placeholder="Ingresa tu contraseña" required>


                <button type="submit">
                    Iniciar sesión
                </button>


                <div class="separador">
                    <span>o</span>
                </div>


                <button type="button" class="btn-registro" onclick="window.location.href='registro.html'">
                    Registrarse
                </button>

    <!-- REGISTRO -->
    <main class="registro-container">

        <!-- LOGO -->
        <section class="registro-logo">

            <div class="logo-placeholder">
                LOGO
            </div>

        </section>


        <!-- FORMULARIO -->
        <section class="registro-box">

            <h1>Crear cuenta</h1>

            <form id="registroForm">

                <label for="nombre">Nombre</label>

                <input type="text" id="nombre" name="nombre" maxlength="10" required>


                <label for="paterno">Apellido paterno</label>

                <input type="text" id="paterno" name="paterno" maxlength="10" required>


                <label for="materno">Apellido materno</label>

                <input type="text" id="materno" name="materno" maxlength="10" required>


                <label for="telefono">Teléfono</label>

                <input type="tel" id="telefono" name="telefono" maxlength="10" required>


                <label for="correo">Correo electrónico</label>

                <input type="email" id="correo" name="correo" maxlength="35" required>


                <label for="contrasena">Contraseña</label>

                <input type="password" id="contrasena" name="contrasena" maxlength="15" required>


                <label for="confirmarContrasena">
                    Confirmar contraseña
                </label>

                <input type="password" id="confirmarContrasena" name="confirmarContrasena" maxlength="15" required>


                <button type="submit">
                    Registrarse
                </button>


                <hr>


                <button type="button" class="btn-regresar" onclick="window.location.href='login.html'">
                    Regresar
                </button>


                <p id="mensaje"></p>

            </form>

        </section>

    </main>
